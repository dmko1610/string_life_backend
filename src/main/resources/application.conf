ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [dmitrykovalev.stringlife.ApplicationKt.module]
    }
    cors {
        allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
    }
}

database {
    url = ${DATABASE_URL}
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
}
